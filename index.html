<!DOCTYPE html>
<html>
<head>
    <title>Region 5 Viewer</title>
    <script src="openseadragon/openseadragon.min.js"></script>
    <style>
        #openseadragon {
            width: 100%;
            height: 90vh;
        }
    </style>
</head>
<body>

<h1>Region 5 Viewer</h1>
<div id="openseadragon"></div>

<script>
    var viewer = OpenSeadragon({
        id: "openseadragon",
        prefixUrl: "openseadragon/images/", // Correct path
        tileSources: "region_5.dzi"  // Your DZI file
    });
</script>

</body>
</html>
